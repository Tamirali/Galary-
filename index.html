<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Photo & Video Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="file"] {
            margin: 15px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #progress {
            margin-top: 10px;
            font-weight: bold;
        }
        .media-gallery {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .media-item {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Firebase Media Uploader (Photo & Video)</h2>
        
        <!-- File Input -->
        <input type="file" id="mediaFile" accept="image/*,video/*"><br>
        <button onclick="uploadMedia()">Upload Karein</button>
        
        <p id="progress"></p>

        <h3>Uploaded Media:</h3>
        <div class="media-gallery" id="mediaGallery"></div>
    </div>

    <!-- Firebase SDK (Modular Version v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Aapki Firebase Configuration details
        const firebaseConfig = {
            apiKey: "AIzaSyCwpHJR49lhq8IPfa5aYFOkHuvjy-jQnlA",
            authDomain: "galary-9a304.firebaseapp.com",
            projectId: "galary-9a304",
            storageBucket: "galary-9a304.firebasestorage.app",
            messagingSenderId: "852527168390",
            appId: "1:852527168390:web:27789bba3bf461c3c20a07",
            measurementId: "G-8JQ7XZ7WGL"
        };

        // Firebase Initialize karein
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // Global functions ko window par set karna taaki HTML onclick kaam kare
        window.uploadMedia = function() {
            const fileInput = document.getElementById('mediaFile');
            const file = fileInput.files[0];
            const progressText = document.getElementById('progress');

            if (!file) {
                alert("Pehle koi photo ya video select karein!");
                return;
            }

            // Storage mein file ka path banayein
            const storageRef = ref(storage, 'uploads/' + Date.now() + '_' + file.name);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressText.innerText = `Upload Ho Raha Hai: ${Math.round(progress)}%`;
                }, 
                (error) => {
                    console.error("Upload fail ho gaya:", error);
                    progressText.innerText = "Upload fail ho gaya!";
                }, 
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                        progressText.innerText = "Upload Successfully Ho Gaya!";
                        fileInput.value = ""; 
                        loadMedia(); 
                    });
                }
            );
        };

        // Storage se saari files load karke screen par dikhana
        function loadMedia() {
            const gallery = document.getElementById('mediaGallery');
            gallery.innerHTML = ""; 

            const listRef = ref(storage, 'uploads/');
            listAll(listRef).then((res) => {
                res.items.forEach((itemRef) => {
                    getDownloadURL(itemRef).then((url) => {
                        if (url.includes('.mp4') || url.includes('.mov') || url.includes('.webm') || url.includes('video')) {
                            const video = document.createElement('video');
                            video.src = url;
                            video.controls = true;
                            video.className = 'media-item';
                            gallery.appendChild(video);
                        } else {
                            const img = document.createElement('img');
                            img.src = url;
                            img.className = 'media-item';
                            gallery.appendChild(img);
                        }
                    });
                });
            }).catch((error) => {
                console.log("Media load karne mein error:", error);
            });
        }

        // Jab page load ho toh pehle se saved media dikhayein
        window.onload = loadMedia;
    </script>

</body>
</html>
